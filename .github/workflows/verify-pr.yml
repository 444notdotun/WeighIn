name: Verify PR

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.95.0'

      - name: Fetch locked native helper crates
        run: cargo +1.95.0 fetch --locked --manifest-path native/simulation/Cargo.toml

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Generate bundle
        run: npm run bundle

      - name: Verify committed bundle matches generated output
        run: git diff --exit-code bundled/
